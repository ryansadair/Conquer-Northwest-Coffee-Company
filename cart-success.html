<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Thanks for your order — Conquer Northwest Coffee." />
  <title>Order Confirmed | Conquer Northwest Coffee</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="cart.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    .thanks-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem 4rem;
      background: var(--deep);
    }
    .thanks-wrap h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 900;
      color: var(--warm-white);
      margin-bottom: 1rem;
    }
    .thanks-wrap h1 em { font-style: italic; color: var(--gold); }
    .thanks-wrap p {
      max-width: 480px;
      color: rgba(245,239,230,0.65);
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }
    .thanks-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 320px;
      width: 100%;
      background: var(--gold);
      color: var(--deep);
      font-family: var(--font-head);
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 1rem 2rem;
      text-decoration: none;
      transition: background 0.25s ease, transform 0.2s ease;
    }
    .thanks-btn:hover { background: var(--amber); transform: translateY(-2px); }
    .thanks-check {
      width: 72px; height: 72px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      color: var(--gold);
    }
  </style>
</head>
<body>
  <nav class="nav scrolled" id="nav">
    <a href="index.html" class="nav-logo">
      <img src="Logo-White.png" alt="Conquer Northwest Coffee" style="height:50px; width:auto; display:block;" />
    </a>
    <ul class="nav-links">
      <li><a href="coffee.html">Coffee</a></li>
      <li><a href="discover.html">Discover</a></li>
      <li><a href="index.html#gear">Gear</a></li>
      <li><a href="about.html">Our Story</a></li>
      <li><a href="coffee.html" class="nav-cta">Shop Now</a></li>
    </ul>
    <button class="nav-hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="thanks-wrap">
    <div class="thanks-check">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1>Order <em>confirmed.</em></h1>
    <p>Thanks for supporting Conquer Northwest Coffee. Your beans are roasted to order and shipped fresh — and a tree gets planted in the Pacific Northwest with every order.</p>
    <a href="coffee.html" class="thanks-btn">Back to the coffee</a>
  </div>

  <script src="cart.js"></script>
  <script src="main.js"></script>
  <script>
    // Clear the cart after a successful checkout.
    try { localStorage.removeItem("cnwc_cart_v1"); } catch (e) {}
  </script>
</body>
</html>
